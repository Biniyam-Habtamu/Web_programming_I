<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
</head>

<body>

    <div>
        <div class="row">
            <div class="bg-card" style="background-color:rgb(38, 38, 45); height: 230px;">
                <div class="card-body pt-4" style="padding-left: 60px; margin: 20px 15px 0px;">
                    <p class="card-pill"
                        style="background-color: rgb(255 193 7); display: inline-block; padding: 2px 7.8px; border-radius: 8px; font-size: 12px; font-weight: 700;">
                        Free workshop</p>
                    <h1 class="card-title"
                        style="color: white; font-weight: 700; font-size: 48px; width: 900px; margin-bottom: 8px;">Web
                        Design Workshop</h1>
                    <p class="card-text" style="color: white; font-size: 20px; font-weight: 100;">Build your first
                        responsive webpage with HTML and Bootstrap.</p>
                </div>
            </div>
        </div>


  <div class="row py-4" style="margin: 0px 90px;">
            <div class="col-sm-5 mb-3 mb-sm-0" style="padding-top: 12px;">
                <div class="card">
                    <div class="card-body p-4">
                        <h4 class="card-title" style="margin-bottom: 16px;">Workshop details</h4>
                        <div class="card-details">
                            <p style="font-weight: 700; display: inline;">Day</p>
                            <p>Saturday</p>
                        </div>
                        <div class="card-details">
                            <p style="font-weight: 700; display: inline;">Location</p>
                            <p>School computer lab</p>
                        </div>
                        <div class="card-details">
                            <p style="font-weight: 700; margin: 0;">What to bring</p>
                            <p style="margin: 0;">A laptop and charger</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-7" style="padding-top: 12px;">
                <div class="card">
                    <div class="card-body p-4">
                        <h4 class="card-title" style="margin-bottom: 16px;">Register for a session</h4>
                        <form>
                            <div class="mb-3">
                                <label for="exampleInputPassword1" class="form-label">Full name</label>
                                <input type="password" class="form-control" id="exampleInputPassword1">
                            </div>
                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                            </div>
                            <legend class="fs-6" style="font-weight: 500;">Choose a session</legend>
                            <div style="margin-bottom: 24px;">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
                                    <label class="form-check-label" for="radioDefault1">Morning · 9:00–11:00 AM</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2">
                                    <label class="form-check-label" for="radioDefault2">Afternoon · 2:00–4:00 PM</label>
                                </div>
                            </div>
                                <button class="btn btn-primary px-4" >Register</button>
                            <p class="form-text mt-3 mb-0">Practice form. Entries are discarded.</p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
