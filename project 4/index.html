<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  </head>
  <body>
    <h1>Hello, world!</h1>

    <div class="container" style="height: 200px; background-color: aqua ;">

        <h1>container</h1>

    </div>

    <div class="container-fluid" style="height: 200px; background-color: rgb(102, 255, 0) ;">
        <h1>fluid</h1>

    </div>

    <div class="container-lg" style="height: 200px; background-color: rgb(255, 0, 0) ;">
        <h1>large</h1>

    </div>

    <div class="container-md" style="height: 200px; background-color: rgb(0, 76, 255) ;">
        <h1>medium</h1>

    </div>

    <div class="container-sm" style="height: 200px; background-color: rgb(242, 255, 0) ;">
        <h1>small</h1>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
  </body>
</html>
